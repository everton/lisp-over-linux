# /etc/nsswitch.conf of the lisp-over-linux initramfs (doc/networking.org §2c).
# Our own code never reads this — dns.lisp is the resolver. It is here for glibc
# programs (the host's tools run in a container): look names up in /etc/hosts,
# then ask the DNS servers in /etc/resolv.conf, which dns.lisp writes from the
# DHCP lease.
hosts:	files dns
